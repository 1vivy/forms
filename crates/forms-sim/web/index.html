<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>forms simulator</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.75rem;
        background: #0b0b0d;
        color: #c8c8cc;
        font: 14px/1.4 ui-sans-serif, system-ui, sans-serif;
      }
      .phone {
        position: relative;
        padding: 14px 16px;
        border-radius: 36px;
        background: linear-gradient(160deg, #1b1b21, #121216);
        border: 2px solid #2c2c34;
        box-shadow:
          0 0 0 1px #000,
          0 24px 60px rgba(0, 0, 0, 0.65);
      }
      canvas {
        display: block;
        width: auto;
        height: auto;
        max-width: min(84vw, 38vh);
        max-height: 78vh;
        image-rendering: pixelated;
        background: #000;
        border-radius: 22px;
      }
      .keys {
        position: absolute;
        top: 8%;
        right: -9px;
        display: flex;
        flex-direction: column;
        gap: 38px;
      }
      .group {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .key {
        width: 12px;
        height: 84px;
        padding: 0;
        border: 1px solid #3a3a44;
        border-left: none;
        border-radius: 0 7px 7px 0;
        background: linear-gradient(90deg, #232329, #34343c);
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.08),
          0 2px 6px rgba(0, 0, 0, 0.6);
        color: #8d8d96;
        font: 9px/1 ui-sans-serif, system-ui, sans-serif;
        letter-spacing: 0.06em;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
      }
      .key span {
        writing-mode: vertical-rl;
        text-orientation: mixed;
      }
      .key.power {
        height: 56px;
      }
      .key:hover {
        background: linear-gradient(90deg, #2a2a32, #3f3f49);
        color: #d6d6dd;
      }
      .key:active {
        transform: translateX(-2px);
      }
      .bar {
        display: flex;
        gap: 0.5rem;
        flex-wrap: wrap;
        justify-content: center;
      }
      .bar button {
        background: #1c1c21;
        color: inherit;
        border: 1px solid #33333a;
        border-radius: 8px;
        padding: 0.35rem 0.7rem;
        font: inherit;
        cursor: pointer;
      }
      .bar button:hover {
        background: #26262c;
      }
      .hint {
        opacity: 0.65;
        font-size: 12px;
        text-align: center;
        max-width: 34rem;
      }
      .notice {
        min-height: 1.4em;
        font-family: ui-monospace, monospace;
        font-size: 12px;
        color: #7ad1a8;
      }
    </style>
  </head>
  <body>
    <div class="bar">
      <button id="reopen">Restart</button>
    </div>
    <div class="phone">
      <canvas id="page" width="1272" height="2772" tabindex="0"></canvas>
      <div class="keys" aria-label="Phone keys">
        <div class="group">
          <button class="key" data-code="0" title="Volume Up" aria-label="Volume Up">
            <span>Vol +</span>
          </button>
          <button class="key" data-code="1" title="Volume Down" aria-label="Volume Down">
            <span>Vol −</span>
          </button>
        </div>
        <button class="key power" data-code="3" title="Power" aria-label="Power">
          <span>Power</span>
        </button>
      </div>
    </div>
    <div class="hint">
      Volume Up and Volume Down move. Power selects. Escape goes back. The side
      buttons of the phone do the same. Click the page first.
    </div>
    <div class="notice" id="notice"></div>
    <script type="module">
      import { start } from "./sim.js";

      const page = await start({
        wasm: "./forms_sim.wasm",
        canvas: document.getElementById("page"),
        notice: document.getElementById("notice"),
      });
      const canvas = document.getElementById("page");
      canvas.focus();

      for (const button of document.querySelectorAll("[data-code]")) {
        button.addEventListener("click", () => {
          page.press(Number(button.dataset.code));
          canvas.focus();
        });
      }

      document.getElementById("reopen").addEventListener("click", () => {
        page.open();
        canvas.focus();
      });
    </script>
  </body>
</html>
