<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>forms simulator</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.75rem;
        background: #0b0b0d;
        color: #c8c8cc;
        font: 14px/1.4 ui-sans-serif, system-ui, sans-serif;
      }
      canvas {
        max-width: min(96vw, 60vh * 0.459);
        max-height: 88vh;
        image-rendering: pixelated;
        background: #000;
        border-radius: 18px;
        box-shadow: 0 0 0 2px #26262b, 0 18px 40px rgba(0, 0, 0, 0.6);
      }
      .bar {
        display: flex;
        gap: 0.5rem;
        flex-wrap: wrap;
        justify-content: center;
      }
      button {
        background: #1c1c21;
        color: inherit;
        border: 1px solid #33333a;
        border-radius: 8px;
        padding: 0.35rem 0.7rem;
        font: inherit;
        cursor: pointer;
      }
      button:hover {
        background: #26262c;
      }
      .hint {
        opacity: 0.65;
        font-size: 12px;
        text-align: center;
      }
      .notice {
        min-height: 1.4em;
        font-family: ui-monospace, monospace;
        font-size: 12px;
        color: #7ad1a8;
      }
    </style>
  </head>
  <body>
    <div class="bar">
      <button id="reopen">Restart</button>
    </div>
    <canvas id="page" width="1272" height="2772" tabindex="0"></canvas>
    <div class="hint">Arrow keys move, Enter selects, Escape goes back. Click the page first.</div>
    <div class="notice" id="notice"></div>
    <script type="module">
      import { start } from "./sim.js";
      const page = await start({
        wasm: "./forms_sim.wasm",
        canvas: document.getElementById("page"),
        notice: document.getElementById("notice"),
        fixture: 0,
      });
      document.getElementById("page").focus();
      document.getElementById("reopen").addEventListener("click", () => {
        page.open(0);
        document.getElementById("page").focus();
      });
    </script>
  </body>
</html>
